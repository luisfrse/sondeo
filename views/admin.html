<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d1a2a">
<meta name="robots" content="noindex">
<title>Sondeo · Admin</title>
<link rel="stylesheet" href="/dc/fuentes/fuentes.css">
<link rel="stylesheet" href="/dc/tokens.css">
<link rel="stylesheet" href="/dc/base.css">
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/tema.js"></script>
</head>
<body class="dc-body">
<header class="dc-header">
  <a class="dc-brand" href="/admin"><span class="dc-brand__tile"><span class="dc-icon" data-icon="chart" aria-hidden="true"></span></span><span>Sondeo</span></a>
  <div class="dc-header__actions" id="tools"></div>
</header>
<main class="sd-wrap">
  <div>
    <h1 data-i="a_sub"></h1>
    <p class="dc-muted" data-i="a_hint"></p>
  </div>
  <div class="sd-stats" id="stats" aria-live="polite"></div>
  <form class="dc-card sd-admin-form" id="cform" novalidate>
    <div class="dc-field"><label class="dc-label" for="et" data-i="a_person"></label><input class="dc-input" type="text" id="et" maxlength="60" autocomplete="off" aria-describedby="err"></div>
    <div class="dc-field"><label class="dc-label" for="cad" data-i="a_expires"></label><input class="dc-input" type="date" id="cad"></div>
    <button class="dc-btn dc-btn--primary" id="crea" type="submit"><span class="dc-icon" data-icon="plus" aria-hidden="true"></span><span data-i="a_create"></span></button>
  </form>
  <div id="err" class="sd-msg" aria-live="assertive"></div>
  <div id="nou"></div>
  <section aria-labelledby="ct">
    <h2 class="dc-card__title" id="ct" data-i="codes_title"></h2>
    <div class="sd-codes" id="codes"></div>
    <div class="dc-state" id="empty" hidden><span class="dc-state__icon"><span class="dc-icon" data-icon="key" aria-hidden="true"></span></span><p class="dc-state__title" data-i="a_none"></p></div>
  </section>
</main>
<script src="/dc/iconos/iconos.js"></script>
<script src="/dc/base.js"></script>
<script src="/i18n.js"></script>
<script src="/ui.js"></script>
<script src="/admin.js"></script>
</body>
</html>

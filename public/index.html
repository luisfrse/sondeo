<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sondeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.slide{margin-bottom:14px}
.slide .h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.slide .h b{color:var(--accent);min-width:26px}
.slide .h select{width:auto;flex:0 0 auto}
.slide .h .sp{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
/* presentació */
#pres{display:none;min-height:100dvh;padding:10px clamp(12px,2vw,28px) 20px}
.pbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pbar .sp{flex:1}
.stage{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start}
.main .q{font-size:clamp(1.6rem,3.2vw,2.8rem);margin:0 0 20px}
.main .tot{color:var(--muted);margin-top:14px}
.side{position:sticky;top:10px;text-align:center}
.side .qr{background:#fff;border-radius:16px;padding:10px;width:100%;aspect-ratio:1}
.side .qr img{width:100%;height:100%;display:block}
.side .cd{font-family:Roboto,sans-serif;font-size:2.6rem;font-weight:700;letter-spacing:.14em;margin-top:10px}
.side .url{font-size:.95rem;color:var(--muted);word-break:break-all}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.dots button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-size:.8rem}
.dots button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* resultats */
.hb{display:grid;grid-template-columns:minmax(120px,32%) 1fr 90px;gap:12px;align-items:center;margin-bottom:12px;font-size:clamp(1rem,1.6vw,1.4rem)}
.hb .t{overflow-wrap:anywhere}
.hb .tr{height:34px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden}
.hb .f{height:100%;background:linear-gradient(90deg,var(--sea),var(--accent));border-radius:10px;transition:width .5s cubic-bezier(.2,.8,.2,1);min-width:2px}
.hb .n{text-align:right;color:var(--muted)}
.cols{display:flex;gap:14px;align-items:flex-end;height:260px}
.cols>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
.cols .f{width:100%;background:linear-gradient(0deg,var(--sea),var(--accent));border-radius:10px 10px 0 0;transition:height .5s;min-height:2px}
.cols b{font-size:1.6rem}
.avg{font-family:Roboto;font-size:3rem;font-weight:700;margin:8px 0}
.cloud{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:center;align-items:center;min-height:240px;padding:10px;line-height:1.05}
.cloud span{font-family:Roboto,sans-serif;font-weight:700;transition:font-size .4s}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.note{position:relative;padding:14px 16px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:clamp(1rem,1.5vw,1.25rem);overflow-wrap:anywhere}
.note.star{border-color:var(--accent);background:rgba(176,139,224,.25)}
.note.hid{opacity:.35}
.note .ac{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.note .ac button{background:transparent;border:1px solid var(--line);border-radius:8px;color:#fff;cursor:pointer;padding:2px 8px}
body.proj .note .ac{display:none}
.msg{min-height:1.3em;color:#ffb3ad}
@media(max-width:820px){.stage{grid-template-columns:1fr}.side{position:static;max-width:260px;margin:0 auto}.two{grid-template-columns:1fr}}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);padding:4px 12px;cursor:pointer;font-weight:700;font-size:.85rem}
.lang button.on{background:var(--accent);color:var(--accent-ink)}
.qa{display:grid;gap:10px}
.qi{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:clamp(1rem,1.6vw,1.35rem)}
.qi .v{font-family:Roboto;font-weight:700;font-size:1.6rem;text-align:center;color:var(--accent)}
.qi .v small{display:block;font-size:.7rem;color:var(--muted);font-weight:400}
.qi.done{opacity:.5}.qi.done .tx{text-decoration:line-through}
.qi.hid{opacity:.3}
.qi .ac{display:flex;gap:6px}
.qi .ac button{background:transparent;border:1px solid var(--line);border-radius:8px;color:#fff;cursor:pointer;padding:4px 10px}
body.proj .qi .ac{display:none}
@media(max-width:820px){.qi{grid-template-columns:56px 1fr}.qi .ac{grid-column:1/-1}}
</style>
</head>
<body>
<div id="login" style="display:none">
  <header class="top"><h1>Sondeo</h1><span class="lang" id="lang3"></span></header>
  <div class="wrap" style="max-width:460px">
    <div class="card" style="margin-top:40px">
      <h2 data-i="login_title"></h2>
      <p class="muted" data-i="login_help"></p>
      <input type="text" id="lcode" data-ph="code_ph" autocomplete="off" autocapitalize="characters" spellcheck="false" style="font-size:1.4rem;letter-spacing:.12em;text-align:center">
      <label class="pill" style="display:inline-flex;gap:6px;margin:12px 0;cursor:pointer"><input type="checkbox" id="lrem" checked> <span data-i="remember"></span></label>
      <p class="msg" id="lerr" role="alert"></p>
      <button class="btn" id="lgo" data-i="login_btn"></button>
      <p class="muted" style="font-size:.9rem;margin-top:16px"><span data-i="no_code"></span> <a id="contact" href="#" target="_blank" rel="noopener" data-i="contact_link"></a></p>
    </div>
  </div>
</div>
<div id="edit" style="display:none">
  <header class="top"><h1 data-i="edit_title"></h1><span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pill" id="hello"></span><button class="btn ghost sm" id="logout" data-i="logout"></button><span class="lang" id="lang"></span></span></header>
  <div class="wrap">
    <p class="muted" data-i="intro"></p>
    <div id="slides"></div>
    <div class="addrow" id="addrow"></div>
    <div class="card">
            <p class="msg" id="msg" role="alert"></p>
      <div class="bar">
        <button class="btn" id="start" data-i="start"></button>
        <button class="btn ghost sm" id="exp" data-i="export"></button>
        <button class="btn ghost sm" id="imp" data-i="import"></button>
        <button class="btn ghost sm" id="ex" data-i="example"></button>
        <input type="file" id="file" accept=".json,application/json" hidden>
      </div>
      <p class="muted" style="margin:0;font-size:.85rem" data-i="saved_note"></p>
    </div>
  </div>
</div>

<div id="pres">
  <div class="pbar">
    <button class="btn ghost sm" id="prev">◀</button>
    <button class="btn ghost sm" id="next">▶</button>
    <button class="btn sm" id="tog"></button>
    <button class="btn ghost sm" id="clr" data-i="clear"></button>
    <label class="pill" style="cursor:pointer"><input type="checkbox" id="auto" checked> <span data-i="auto"></span></label>
    <span class="sp"></span>
    <span class="pill" id="stu"></span>
    <span class="lang" id="lang2"></span>
    <button class="btn ghost sm" id="fs" data-i="fs"></button>
    <button class="btn danger sm" id="end" data-i="end"></button>
  </div>
  <div class="stage">
    <div class="main"><h2 class="q" id="pq"></h2><div id="res"></div><div class="tot" id="tot"></div><div class="dots" id="dots"></div></div>
    <aside class="side"><div class="qr"><img id="qr" data-alt="qr_alt" alt=""></div><div class="cd" id="cd"></div><div class="url" id="url"></div></aside>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/host.js"></script>
</body>
</html>

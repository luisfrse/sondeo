<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d1a2a">
<meta name="robots" content="noindex">
<title>Sondeo</title>
<link rel="stylesheet" href="/dc/fuentes/fuentes.css">
<link rel="stylesheet" href="/dc/tokens.css">
<link rel="stylesheet" href="/dc/base.css">
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/tema.js"></script>
</head>
<body class="dc-body">
<header class="dc-header" id="top">
  <a class="dc-brand" href="/"><span class="dc-brand__tile"><span class="dc-icon" data-icon="chart" aria-hidden="true"></span></span><span>Sondeo</span></a>
  <div class="dc-header__actions" id="tools"></div>
</header>

<main id="gate" class="sd-gate" role="status"><div class="dc-state"><div class="dc-spinner" aria-hidden="true"></div><p data-i="loading"></p></div></main>

<main id="login" class="sd-wrap" hidden>
  <form class="sd-login dc-card" id="lform" novalidate>
    <div class="sd-login__brand">
      <span class="dc-brand__tile dc-brand--lg"><span class="dc-icon" data-icon="key" aria-hidden="true"></span></span>
      <h1 data-i="login_title"></h1>
      <p class="dc-muted" data-i="login_help"></p>
    </div>
    <div class="dc-field">
      <label class="dc-label" for="lcode" data-i="code_lbl"></label>
      <input class="dc-input dc-input--code" type="text" id="lcode" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="14" inputmode="text" aria-describedby="lerr">
    </div>
    <label class="dc-check"><input type="checkbox" id="lrem" checked><span data-i="remember"></span></label>
    <div id="lerr" class="sd-msg" aria-live="assertive"></div>
    <button class="dc-btn dc-btn--primary dc-btn--lg dc-btn--block" id="lgo" type="submit" data-i="login_btn"></button>
    <p class="dc-small dc-muted"><span data-i="no_code"></span> <a id="contact" href="#" target="_blank" rel="noopener" data-i="contact_link"></a></p>
  </form>
</main>

<main id="edit" class="sd-wrap" hidden>
  <div>
    <h1 data-i="edit_title"></h1>
    <p class="dc-muted" data-i="intro"></p>
  </div>
  <div id="slides" class="dc-stack"></div>
  <section aria-labelledby="addh">
    <h2 class="dc-card__title" id="addh" data-i="add_title"></h2>
    <div class="sd-add" id="addrow"></div>
  </section>
  <div class="dc-card dc-stack">
    <div id="msg" class="sd-msg" aria-live="assertive"></div>
    <div class="sd-actions">
      <button class="dc-btn dc-btn--primary dc-btn--lg" id="start" type="button"><span class="dc-icon" data-icon="arrow-right" aria-hidden="true"></span><span data-i="start"></span></button>
      <span class="dc-grow"></span>
      <button class="dc-btn dc-btn--secondary" id="exp" type="button"><span class="dc-icon" data-icon="download" aria-hidden="true"></span><span data-i="export"></span></button>
      <button class="dc-btn dc-btn--secondary" id="imp" type="button"><span class="dc-icon" data-icon="upload" aria-hidden="true"></span><span data-i="import"></span></button>
      <button class="dc-btn dc-btn--secondary" id="ex" type="button"><span class="dc-icon" data-icon="file" aria-hidden="true"></span><span data-i="example"></span></button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
    <p class="dc-small dc-muted" data-i="saved_note"></p>
  </div>
</main>

<div id="pres" class="sd-pres" hidden>
  <div class="sd-pbar" role="toolbar" aria-label="Sondeo">
    <button class="dc-btn dc-btn--secondary dc-btn--icon" id="prev" type="button"><span class="dc-icon" data-icon="chevron-left" aria-hidden="true"></span></button>
    <button class="dc-btn dc-btn--secondary dc-btn--icon" id="next" type="button"><span class="dc-icon" data-icon="chevron-right" aria-hidden="true"></span></button>
    <button class="dc-btn dc-btn--primary" id="tog" type="button"></button>
    <button class="dc-btn dc-btn--secondary" id="clr" type="button"><span class="dc-icon" data-icon="trash" aria-hidden="true"></span><span data-i="clear"></span></button>
    <label class="dc-check"><input type="checkbox" id="auto" checked><span data-i="auto"></span></label>
    <span class="dc-grow"></span>
    <span class="dc-chip dc-chip--warn" id="conn" hidden></span>
    <button class="dc-btn dc-btn--secondary dc-btn--icon" id="fs" type="button"><span class="dc-icon" data-icon="external" aria-hidden="true"></span></button>
    <button class="dc-btn dc-btn--danger" id="end" type="button"><span class="dc-icon" data-icon="log-out" aria-hidden="true"></span><span data-i="end"></span></button>
  </div>
  <div class="sd-stage">
    <div>
      <h2 class="sd-q" id="pq"></h2>
      <div class="sd-res" id="res"></div>
      <div class="sd-progress" id="dots" role="group"></div>
    </div>
    <aside class="sd-side" aria-label="QR">
      <div class="sd-qr"><img id="qr" data-alt="qr_alt" alt="" width="240" height="240"></div>
      <div class="sd-code" id="cd"></div>
      <div class="sd-url" id="url"></div>
      <span class="dc-chip dc-chip--dot" id="state"></span>
      <div class="sd-ring sd-ring--lg" id="ring"></div>
    </aside>
  </div>
</div>

<script src="/dc/iconos/iconos.js"></script>
<script src="/dc/base.js"></script>
<script src="/i18n.js"></script>
<script src="/ui.js"></script>
<script src="/host.js"></script>
</body>
</html>

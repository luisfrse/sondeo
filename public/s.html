<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sondeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
main{max-width:560px;margin:0 auto;padding:8px 16px 40px}
.q{font-size:1.5rem;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-size:1.05rem;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:rgba(176,139,224,.22)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{aspect-ratio:1;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-size:1.5rem;font-weight:700;cursor:pointer}
.scale button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:6px}
.wait{text-align:center;padding:48px 10px}
.wait .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);margin:0 auto 18px;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.6);opacity:.5}}
.ok{color:var(--ok);font-weight:700;margin-top:12px;min-height:1.4em}
.row{display:flex;gap:8px;margin-bottom:8px}
.cnt{font-size:.85rem;color:var(--muted);text-align:right;margin-top:6px}
.joinbox{max-width:360px;margin:60px auto;text-align:center}
.joinbox input{font-size:2rem;text-align:center;letter-spacing:.3em}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);padding:4px 10px;cursor:pointer;font-weight:700;font-size:.8rem}
.lang button.on{background:var(--accent);color:var(--accent-ink)}
.topr{display:flex;gap:8px;align-items:center}
.qlist{margin-top:18px;display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);overflow-wrap:anywhere}
.qrow.done{opacity:.55}
.qrow small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.vb{min-width:64px;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-weight:700}
.vb.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.vb[disabled]{opacity:.45;cursor:default}
</style>
</head>
<body>
<header class="top"><h1>Sondeo</h1><span class="topr"><span class="pill" id="st"></span><span class="lang" id="lang"></span></span></header>
<main id="m"></main>
<script src="/i18n.js"></script>
<script src="/student.js"></script>
</body>
</html>
